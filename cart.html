<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Корзина учебного интернет-магазина.">
  <title>Корзина — Учебный интернет-магазин</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/theme.js"></script>
  <script src="js/data.js" defer></script>
  <script src="js/cart.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">К содержимому</a>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>
      <button class="button button--secondary site-header__theme" id="theme-toggle" type="button">Тёмная тема</button>
      <button class="button button--secondary menu-toggle" type="button" aria-expanded="false" aria-controls="main-navigation" hidden>Меню</button>
      <nav id="main-navigation" class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html">Главная</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="catalog.html">Каталог</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link site-nav__link--active" aria-current="page" href="cart.html">Корзина <span class="cart-badge" hidden>0</span></a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="order.html">Сделать заказ</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="contacts.html">Контакты</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="feedback.html">Обратная связь</a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <span class="breadcrumbs__separator">/</span>
      <span class="breadcrumbs__current">Корзина</span>
    </nav>

    <section class="section">
      <h1>Корзина</h1>

      <p id="cart-empty" class="catalog-empty" hidden>
        Корзина пуста. Перейдите в <a href="catalog.html">каталог</a> и добавьте товары.
      </p>

      <div id="cart-root"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
    <p>Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
